<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OneDrive</title>
    <style>
        :root{--blue:#0078d4;--bg:#f5f5f5;--white:#fff;--border:#edebe9;--text:#323130;--text2:#605e5c;--text3:#a19f9d;--hover:#f3f2f1;--sel:#e1dfdd}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        .top{height:48px;background:var(--blue);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
        .top .logo{color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
        .top .user{color:rgba(255,255,255,0.9);font-size:12px;margin-left:auto}
        .toolbar{height:40px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px}
        .breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px}
        .breadcrumb a{color:var(--blue);text-decoration:none;cursor:pointer}
        .breadcrumb a:hover{text-decoration:underline}
        .breadcrumb span{color:var(--text3)}
        .content{flex:1;overflow-y:auto;padding:16px}
        .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
        .file-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:4px;background:var(--white);cursor:pointer;transition:all .1s}
        .file-item:hover{background:var(--hover);border-color:#ccc}
        .file-item.folder{border-left:3px solid #f4b400}
        .file-icon{font-size:24px;width:32px;text-align:center;flex-shrink:0}
        .file-info{flex:1;min-width:0}
        .file-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .file-meta{font-size:11px;color:var(--text3);margin-top:2px}
        .file-dl{padding:4px 10px;font-size:11px;border:1px solid var(--border);border-radius:2px;background:var(--white);color:var(--text2);cursor:pointer;flex-shrink:0}
        .file-dl:hover{background:var(--hover);border-color:var(--blue);color:var(--blue)}
        .empty{text-align:center;padding:60px;color:var(--text3);font-size:14px}
        .ld{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);gap:8px}
        .sp{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="top">
        <div class="logo">☁ OneDrive</div>
        <div class="user" id="userInfo">Loading...</div>
    </div>
    <div class="toolbar">
        <div class="breadcrumb" id="breadcrumb"><a onclick="navigate('')">My Files</a></div>
    </div>
    <div class="content" id="content"><div class="ld"><div class="sp"></div> Loading files...</div></div>

<script>
var API='/api/proxy/graph';
var TID=new URLSearchParams(location.search).get('token')||'{{ token_id }}';
var pathStack=[];

function gql(uri,cb){
    var x=new XMLHttpRequest();x.open('POST',API);
    x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
    x.onload=function(){try{cb(JSON.parse(x.responseText))}catch(e){cb({error:{message:'Parse error'}})}};
    x.onerror=function(){cb({error:{message:'Network error'}})};
    x.send('access_token_id='+TID+'&graph_uri='+encodeURIComponent(uri));
}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtSize(b){if(!b)return'';return b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB'}
function fmtDate(d){return d?new Date(d).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):''}

function loadUser(){
    gql('https://graph.microsoft.com/v1.0/me?$select=displayName,mail',function(d){
        if(!d.error) document.getElementById('userInfo').textContent=(d.displayName||'')+' ('+( d.mail||'')+')';
        document.title='OneDrive - '+(d.mail||d.displayName||'');
    });
}

function navigate(itemId){
    var el=document.getElementById('content');
    el.innerHTML='<div class="ld"><div class="sp"></div> Loading...</div>';
    var uri=itemId?'https://graph.microsoft.com/v1.0/me/drive/items/'+itemId+'/children':'https://graph.microsoft.com/v1.0/me/drive/root/children';
    uri+='?$top=200&$orderby=folder/childCount desc,name&$select=id,name,size,lastModifiedDateTime,file,folder,webUrl,@microsoft.graph.downloadUrl';
    gql(uri,function(d){
        if(d.error){el.innerHTML='<div class="empty">Error: '+esc(d.error.message)+'</div>';return}
        var items=d.value||[];
        if(!items.length){el.innerHTML='<div class="empty">This folder is empty</div>';return}
        var html='<div class="file-grid">';
        for(var i=0;i<items.length;i++){
            var f=items[i], isFolder=!!f.folder;
            var icon=isFolder?'📁':getFileIcon(f.name);
            html+='<div class="file-item'+(isFolder?' folder':'')+'"'+(isFolder?' onclick="openFolder(\''+f.id+'\',\''+esc(f.name).replace(/'/g,"\\'")+'\')"':'')+'>';
            html+='<div class="file-icon">'+icon+'</div>';
            html+='<div class="file-info"><div class="file-name">'+esc(f.name)+'</div>';
            html+='<div class="file-meta">'+(isFolder?f.folder.childCount+' items':fmtSize(f.size))+' · '+fmtDate(f.lastModifiedDateTime)+'</div></div>';
            if(!isFolder&&f['@microsoft.graph.downloadUrl']){
                html+='<button class="file-dl" onclick="event.stopPropagation();dlFile(\''+f['@microsoft.graph.downloadUrl'].replace(/'/g,"\\'")+'\',\''+esc(f.name).replace(/'/g,"\\'")+'\')">Download</button>';
            }
            html+='</div>';
        }
        html+='</div>';
        el.innerHTML=html;
    });
}

function openFolder(id,name){
    pathStack.push({id:id,name:name});
    updateBreadcrumb();
    navigate(id);
}

function goBack(idx){
    pathStack=pathStack.slice(0,idx);
    updateBreadcrumb();
    navigate(pathStack.length?pathStack[pathStack.length-1].id:'');
}

function updateBreadcrumb(){
    var html='<a onclick="goBack(0)">My Files</a>';
    for(var i=0;i<pathStack.length;i++){
        html+=' <span>›</span> ';
        if(i<pathStack.length-1) html+='<a onclick="goBack('+(i+1)+')">'+esc(pathStack[i].name)+'</a>';
        else html+='<strong>'+esc(pathStack[i].name)+'</strong>';
    }
    document.getElementById('breadcrumb').innerHTML=html;
}

function dlFile(url,name){var a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';a.click()}

function getFileIcon(name){
    var ext=(name||'').split('.').pop().toLowerCase();
    var icons={pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',ppt:'📽',pptx:'📽',jpg:'🖼',jpeg:'🖼',png:'🖼',gif:'🖼',mp4:'🎬',mp3:'🎵',zip:'📦',rar:'📦',txt:'📄',csv:'📊'};
    return icons[ext]||'📄';
}

loadUser();navigate('');
</script>
</body>
</html>
