<!doctype html>
<html data-bs-theme="dark">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>Login — GraphSpy</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--gs-bg); }
        .login-card { background: var(--gs-bg-card); border: 1px solid var(--gs-border); border-radius: 12px; padding: 40px; width: 380px; max-width: 90vw; }
        .login-card h2 { font-weight: 700; font-size: 22px; margin-bottom: 8px; color: #fff; }
        .login-card p { font-size: 13px; color: var(--gs-text-muted); margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="url(#lg)"/><path d="M8 20V12L14 8L20 12V20L14 16L8 20Z" fill="#0c1222" fill-opacity="0.6"/><path d="M14 16L20 20V12L14 16Z" fill="#fff" fill-opacity="0.9"/><defs><linearGradient id="lg" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs></svg>
            <span style="font-size:18px;font-weight:700;color:#fff">GraphSpy</span>
        </div>
        <h2>Welcome back</h2>
        <p>Enter your panel password to continue.</p>
        {% if error %}
        <div class="alert alert-danger py-2 px-3" style="font-size:13px">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" autofocus required>
            </div>
            <button type="submit" class="btn gs-btn-accent w-100">Sign In</button>
        </form>
    </div>
</body>
</html>
